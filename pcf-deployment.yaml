apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcf
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pcf
  template:
    metadata:
      labels:
        app: pcf
    spec:
      containers:
      - name: pcf
        image: arun1605/open5gs-pcf:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7777
        volumeMounts:
        - name: pcf-config
          mountPath: /etc/open5gs/pcf.yaml
          subPath: pcf.yaml
      volumes:
      - name: pcf-config
        configMap:
          name: pcf-config
