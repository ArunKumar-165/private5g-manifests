apiVersion: apps/v1
kind: Deployment

metadata:
  name: amf
  namespace: open5gs

spec:
  replicas: 1

  selector:
    matchLabels:
      app: amf

  template:
    metadata:
      labels:
        app: amf

    spec:
      containers:
        - name: amf
          image: open5gs-amf
          imagePullPolicy: Never
          ports:
            - containerPort: 38412
              protocol: SCTP
            - containerPort: 7777
              protocol: TCP
          volumeMounts:
            - name: amf-config
              mountPath: /etc/open5gs/amf.yaml
              subPath: amf.yaml

      volumes:
        - name: amf-config
          configMap:
            name: amf-config
