logger:
  file:
    path: /var/log/open5gs/upf.log

global:
  max:
    ue: 1024

upf:
  pfcp:
    server:
      - address: 0.0.0.0
        advertise: upf.open5gs.svc.cluster.local

  gtpu:
    server:
      - address: 0.0.0.0
        advertise: upf.open5gs.svc.cluster.local

  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1

  metrics:
    server:
      - address: 0.0.0.0
        port: 9090

################################################################################
