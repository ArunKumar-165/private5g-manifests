apiVersion: apps/v1
kind: Deployment
metadata:
  name: nrf
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nrf
  template:
    metadata:
      labels:
        app: nrf
    spec:
      containers:
      - name: nrf
        image: arun1605/open5gs-nrf:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7777
        volumeMounts:
        - name: nrf-config
          mountPath: /etc/open5gs/nrf.yaml
          subPath: nrf.yaml
      volumes:
      - name: nrf-config
        configMap:
          name: nrf-config
